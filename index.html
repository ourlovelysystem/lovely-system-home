<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Lovely System</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Georgia, 'Times New Roman', serif;
      background: #fff;
      color: #111;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4rem 2rem;
    }

    main {
      max-width: 34rem;
      width: 100%;
    }

    header {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #bbb;
      margin-bottom: 4.5rem;
    }

    .section {
      margin-bottom: 3.5rem;
    }

    .q {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 0.9rem;
      letter-spacing: 0.01em;
    }

    .a {
      font-size: 1.15rem;
      line-height: 1.75;
      color: #111;
    }

    .a p + p {
      margin-top: 0.5rem;
    }

    em {
      font-style: italic;
    }
  </style>
</head>
<body>
  <main>
    <header>Our Lovely System</header>

    <div class="section">
      <p class="q">What is a lovely system?</p>
      <div class="a">
        <p><em>Force is ugly.</em></p>
        <p>A lovely system eschews force.</p>
      </div>
    </div>

    <div class="section">
      <p class="q">Why is this <em>Our</em> Lovely System and not <em>My</em> Lovely System?</p>
      <div class="a">
        <p>Because force is ugly.</p>
      </div>
    </div>
  </main>
</body>
</html>
